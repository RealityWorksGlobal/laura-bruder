<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAB - Laura Bruder</title>
<meta name="description" content="LAB is an architecture practice that (re)imagines and crafts buildings, interiors and spatial experiences.">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23fff'/><rect x='14' y='4' width='4' height='24'/><rect x='4' y='14' width='24' height='4'/></svg>">

<link rel="stylesheet" href="style.css">
</head>

<body data-view="splash" data-lang="en">

<!-- ───────────── cursor ─────────────
     four independent arms: a plus by default, able to split or point -->
<svg id="cursor" viewBox="-20 -20 40 40" aria-hidden="true">
  <g id="cursor-arms">
    <line class="arm arm-n" x1="0" y1="0" x2="0"   y2="-14"/>
    <line class="arm arm-s" x1="0" y1="0" x2="0"   y2="14"/>
    <line class="arm arm-w" x1="0" y1="0" x2="-14" y2="0"/>
    <line class="arm arm-e" x1="0" y1="0" x2="14"  y2="0"/>
  </g>
</svg>

<!-- ───────────── persistent chrome ───────────── -->
<header id="chrome">
  <a id="lab" href="#/brand" data-clickable aria-label="LAB — brand">LAB</a>

  <!-- top right, as in the client's layout: PROJECTS  INFO -->
  <nav id="nav-main" aria-label="Main">
    <a href="#/projects" data-clickable data-nav="projects">PROJECTS</a>
    <a id="nav-info" href="#/info" data-clickable data-nav="info">INFO</a>
    <!-- not in the new layout; kept so the routes keep working -->
    <a href="#/" data-clickable data-nav="splash" hidden>INSPIRATIONS</a>
    <a href="#/brand" data-clickable data-nav="brand" hidden>BRAND</a>
  </nav>

  <!-- category rail: tags from the sheet + Selected -->
  <nav id="filters" aria-label="Categories" hidden></nav>

  <button id="lang" type="button" data-clickable>DE</button>
</header>

<!-- ───────────── stage ───────────── -->
<main id="stage">

  <!-- 1 · splash / inspirations ------------------------------------ -->
  <section class="view" id="view-splash" aria-label="Inspirations">

    <!-- frame within frame: full-bleed plate, centred inner plate -->
    <div class="frame-outer" id="splash-frame" data-advance>
      <div class="media media-outer" id="splash-bg"></div>
      <div class="media media-inner" id="splash-inner"></div>
    </div>

    <!-- The two angles sit stacked at the centre as a cross. Opening the
         brand sends each to its corner, where they become the frame. -->
    <div id="brand" class="is-closed is-shrunk">
      <svg class="angle tl" viewBox="0 0 24 24" aria-hidden="true"><line x1="0" y1="0" x2="0" y2="18.47" pathLength="1"/><line x1="0" y1="0" x2="18.47" y2="0" pathLength="1"/></svg>
      <svg class="angle br" viewBox="0 0 24 24" aria-hidden="true"><line x1="24" y1="24" x2="24" y2="5.53" pathLength="1"/><line x1="24" y1="24" x2="5.53" y2="24" pathLength="1"/></svg>
      <p class="statement">
        <span class="lab-anchor" data-anchor="splash" aria-hidden="true">LAB</span>
        <span id="brand-text"></span>
      </p>
    </div>
  </section>

  <!-- 2 · project list, with the frame opening inline -->
  <section class="view" id="view-projects" aria-label="Projects">

    <!-- the frame: its two angles fly out of the clicked project's plus -->
    <div id="frame" class="is-closed is-shrunk" hidden>
      <svg class="angle tl" viewBox="0 0 24 24" aria-hidden="true"><line x1="0" y1="0" x2="0" y2="18.47" pathLength="1"/><line x1="0" y1="0" x2="18.47" y2="0" pathLength="1"/></svg>
      <svg class="angle br" viewBox="0 0 24 24" aria-hidden="true"><line x1="24" y1="24" x2="24" y2="5.53" pathLength="1"/><line x1="24" y1="24" x2="5.53" y2="24" pathLength="1"/></svg>
      <div class="frame-body">
        <div class="stack" id="stack"></div>
        <div class="detail-text"><p id="detail-content"></p></div>
        <dl class="meta" id="detail-meta"></dl>
      </div>
    </div>

    <h2 class="detail-title" id="detail-title" hidden></h2>

    <ol id="project-list"></ol>
  </section>

  <!-- 4 · info ------------------------------------------------------ -->
  <section class="view" id="view-info" aria-label="Info">
    <p class="statement statement-info">
      <span class="lab-anchor" data-anchor="info" aria-hidden="true">LAB</span>
      <span id="about"></span>
    </p>
    <div id="accordion"></div>
  </section>

</main>

<div id="drops" aria-hidden="true"></div>
<div id="pop" aria-hidden="true"></div>

<div id="loader"><span></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="script.js"></script>
</body>
</html>
